version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Recife
    open-pull-requests-limit: 5
    groups:
      runtime-security:
        dependency-type: production
        update-types:
          - patch
          - minor
    labels:
      - dependencies
      - security

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: America/Recife
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security
